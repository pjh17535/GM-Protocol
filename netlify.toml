[build]
  # Netlify's build image may not ship Bun, so fetch the exact version this
  # project uses (see .bun-version) through npx.
  command = "npx --yes bun@1.3.14 install --frozen-lockfile && npx --yes bun@1.3.14 run build"
  publish = "dist"
  # Skip the build (and its credit cost) when nothing that ships to the site changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json bun.lock netlify.toml netlify vite.config.ts tailwind.config.js postcss.config.js"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
